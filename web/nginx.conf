# Конфигурация веб-сервера nginx для «Библиотеки».
# nginx выполняет две роли:
#   1) веб-сервер: отдаёт статические файлы веб-интерфейса (HTML, CSS, JS);
#   2) обратный прокси (reverse proxy): запросы /api/... передаёт сервису api.

# группа серверов приложения; "api" — имя сервиса в docker-compose,
# Docker сам превращает его в IP-адрес контейнера внутри сети backend
upstream library_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # не показывать версию nginx в заголовках и страницах ошибок
    server_tokens off;

    # базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ограничение размера тела запроса
    client_max_body_size 1m;

    # сжатие ответов
    gzip on;
    gzip_types text/css application/javascript application/json;

    root  /usr/share/nginx/html;
    index index.html;

    # 1) статические файлы веб-интерфейса
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2) API: /api/authors -> http://api:8000/authors (префикс /api отрезается)
    location /api/ {
        proxy_pass http://library_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # проверка работоспособности самого nginx (используется в HEALTHCHECK)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
