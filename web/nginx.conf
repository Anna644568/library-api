# Конфигурация веб-сервера nginx — единая точка входа (API Gateway) «Библиотеки».
# nginx выполняет две роли:
#   1) веб-сервер: отдаёт статические файлы веб-интерфейса;
#   2) шлюз: по адресу запроса направляет его в нужный микросервис.
#
#   /api/authors, /api/genres, /api/books, /api/svc/catalog/...  → сервис catalog
#   /api/readers,  /api/svc/readers/...                           → сервис readers
#   /api/loans,    /api/svc/loans/...                             → сервис loans
#
# Имена catalog, readers, loans — это имена Service в Kubernetes (или сервисов
# в docker compose). Service сам распределяет запросы между репликами (подами).

upstream catalog { server catalog:8000; }
upstream readers { server readers:8000; }
upstream loans   { server loans:8000; }

server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # общие настройки проксирования (наследуются всеми location ниже)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    # если под недоступен — повторить запрос на другом
    proxy_next_upstream error timeout http_502 http_503;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- сервис catalog ----------
    location /api/authors      { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://catalog; }
    location /api/genres       { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://catalog; }
    location /api/books        { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://catalog; }
    location /api/svc/catalog/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://catalog; }

    # ---------- сервис readers ----------
    location /api/readers      { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://readers; }
    location /api/svc/readers/ { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://readers; }

    # ---------- сервис loans ----------
    location /api/loans        { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://loans; }
    location /api/svc/loans/   { rewrite ^/api/(.*)$ /$1 break; proxy_pass http://loans; }

    # проверка работоспособности самого nginx (livenessProbe / readinessProbe)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
