<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Библиотека</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">▤</span>
      <div>
        <h1>Библиотека</h1>
        <p class="sub">Микросервисы в Kubernetes · nginx → catalog / readers / loans → PostgreSQL</p>
      </div>
    </div>
    <nav class="docs-links" aria-label="Документация API">
      <span>Swagger:</span>
      <a class="docs" href="/api/svc/catalog/docs" target="_blank" rel="noopener">catalog ↗</a>
      <a class="docs" href="/api/svc/readers/docs" target="_blank" rel="noopener">readers ↗</a>
      <a class="docs" href="/api/svc/loans/docs" target="_blank" rel="noopener">loans ↗</a>
    </nav>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main class="layout">
    <section class="card form-card">
      <h2 id="form-title">Добавить</h2>
      <form id="form" autocomplete="off"></form>
      <div class="form-actions">
        <button type="submit" form="form" class="primary" id="submit">Добавить</button>
        <button type="button" id="cancel" hidden>Отмена</button>
      </div>
    </section>

    <section class="card table-card">
      <div class="table-head">
        <h2 id="table-title">Список</h2>
        <form class="find" id="find">
          <input type="number" min="1" id="find-id" placeholder="id" aria-label="Найти по id">
          <button type="submit">Найти по id</button>
          <button type="button" id="refresh" title="Обновить список">⟳</button>
        </form>
      </div>
      <div class="table-wrap"><table id="table"></table></div>
      <p class="empty" id="empty" hidden>Записей пока нет — добавьте первую слева.</p>
    </section>
  </main>

  <section class="log card" aria-live="polite">
    <h2>Последний запрос</h2>
    <div id="status" class="status idle">Запросов ещё не было</div>
  </section>

  <footer class="foot">
    <div class="foot-row" id="foot">Загрузка информации о сборке…</div>
    <div class="foot-row pods">
      <span>Ответили поды:</span>
      <span id="pods">—</span>
      <button type="button" class="small" id="pods-refresh" title="Ещё раз опросить сервисы">⟳ опросить ещё раз</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
