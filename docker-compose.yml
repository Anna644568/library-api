# Локальный запуск микросервисов «Библиотеки» без Kubernetes (для разработки):
#   docker compose up -d --build   →  http://localhost:8090
# В кластере Kubernetes то же самое описано манифестами в каталоге k8s/.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library-dev-pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./k8s/postgres-init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "library"]
      interval: 5s
      retries: 10

  catalog:
    build: { context: ./services, dockerfile: catalog/Dockerfile, target: runtime }
    environment: &svc-env
      ROOT_PATH: /api
      APP_ENV: local
      CHAOS_ENABLED: "true"
      DATABASE_URL: postgresql://library:library-dev-pass@postgres:5432/catalog
    depends_on: { postgres: { condition: service_healthy } }

  readers:
    build: { context: ./services, dockerfile: readers/Dockerfile, target: runtime }
    environment:
      <<: *svc-env
      DATABASE_URL: postgresql://library:library-dev-pass@postgres:5432/readers
    depends_on: { postgres: { condition: service_healthy } }

  loans:
    build: { context: ./services, dockerfile: loans/Dockerfile, target: runtime }
    environment:
      <<: *svc-env
      DATABASE_URL: postgresql://library:library-dev-pass@postgres:5432/loans
      CATALOG_URL: http://catalog:8000
      READERS_URL: http://readers:8000
    depends_on: { postgres: { condition: service_healthy } }

  web:
    build: ./web
    ports:
      - "8090:80"
    depends_on:
      catalog: { condition: service_healthy }
      readers: { condition: service_healthy }
      loans:   { condition: service_healthy }

volumes:
  pgdata:
